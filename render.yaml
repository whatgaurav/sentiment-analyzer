services:
  - type: web
    name: prd-scorer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn prd_scorer:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
